<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتصال امن TronLink | AI-Trader</title>
<style>
body{font-family:sans-serif;background:#101827;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}
main{max-width:420px;width:100%;text-align:center;background:#1d293b;padding:28px 20px;border-radius:18px;box-sizing:border-box}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#16a085;color:white;font-size:17px;font-weight:bold}
p{line-height:2;color:#d1d9e6}
#error{color:#ff8c8c}
</style>
</head>
<body>
<main>
<h2>AI-Trader</h2>
<h3 id="heading">درخواست اتصال امن</h3>
<p id="info">برای ادامه، دکمه زیر را بزنید تا TronLink باز شود.</p>
<button id="open" type="button">بازکردن TronLink</button>
<p id="error"></p>
</main>
<script>
(()=>{
 const error=document.getElementById("error");
 const button=document.getElementById("open");
 try{
  const raw=location.hash.slice(1);
  if(!raw)throw Error("اطلاعات درخواست موجود نیست.");
  const data=JSON.parse(decodeURIComponent(raw));
  if(!data.actionId||!data.callbackUrl||
     !["login","sign"].includes(data.action)||
     data.protocol!=="TronLink"||data.version!=="1.0"||
     data.chainId!=="0x2b6653dc"||
     data.callbackUrl!=="https://ai-trader-backend-1-n7yv.onrender.com/tronlink-callback"||
     data.url!=="https://majid276890000.github.io/ai-trader-miniapp/")
    throw Error("درخواست معتبر نیست؛ از داخل Mini App دوباره تلاش کنید.");
  const link="tronlinkoutside://pull.activity?param="+encodeURIComponent(JSON.stringify(data));
  document.getElementById("heading").textContent=
    data.action==="login"?"اتصال کیف پول TRON":"امضای پیام امنیتی";
  button.addEventListener("click",()=>{location.href=link});
 }catch(e){
  button.disabled=true;
  error.textContent=e.message||"خطا در آماده‌سازی درخواست";
 }
})();
</script>
</body>
</html>
